<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Museum Odyssey</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="welcomeScreen">
    <div class="welcomeBox">
        <h1>Museum Odyssey</h1>
        <p class="welcomeSubtitle">An Interactive Learning Experience</p>
        <p class="welcomeDescription">
            Explore the museum, discover different fields of knowledge,
            and learn something new along the way.
        </p>
        <button id="startButton">Enter Museum</button>
    </div>
</div>

<div id="crosshair"></div>

<div id="bookPrompt">
    Press <strong>E</strong> to open book
</div>

<div id="pauseMenu">
    <div class="menuBox">
        <h1>Museum Odyssey</h1>
        <p>Learning Experience Paused</p>
        <button id="resumeButton">Resume Learning</button>
        <button id="exitButton">Exit Museum</button>
    </div>
</div>

<div id="mobileControls">
    <div id="joystick">
        <div id="joystickKnob"></div>
    </div>

    <button id="mobileMenuButton">☰</button>

    <button id="interactButton">
        Open Book
    </button>
</div>

<script type="module" src="script.js"></script>

</body>
</html>
